<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veda — Your Health Journey, Understood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E2A47; --ink:#14283F; --muted:#5B6E83; --line:#DCE6F0; --bg:#F4F8FC; --card:#FFFFFF; --soft:#E7F0FA; --blue:#2F78BD; --blue-d:#1F5E9C;
  --teal:#0E9F8C; --teal-soft:#DDF4F0; --amber:#B86E00; --amber-soft:#FFF2DB; --red:#B83A2E; --red-soft:#FCE8E5; --shadow:0 1px 2px rgba(14,42,71,.06),0 6px 20px rgba(14,42,71,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --serif:'Newsreader',Georgia,'Times New Roman',serif; --sans:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--navy:#CFE3F7;--ink:#E6EEF7;--muted:#9DB1C6;--line:#24384E;--bg:#0A1625;--card:#102238;--soft:#16304A;--blue:#6BAEEA;--blue-d:#8CC1F2;--teal:#3CC9B5;--teal-soft:#0F3A3A;--amber:#F0B45A;--amber-soft:#3A2B10;--red:#F08A7E;--red-soft:#3D1B18;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3)}
}
:root[data-theme="dark"]{--navy:#CFE3F7;--ink:#E6EEF7;--muted:#9DB1C6;--line:#24384E;--bg:#0A1625;--card:#102238;--soft:#16304A;--blue:#6BAEEA;--blue-d:#8CC1F2;--teal:#3CC9B5;--teal-soft:#0F3A3A;--amber:#F0B45A;--amber-soft:#3A2B10;--red:#F08A7E;--red-soft:#3D1B18;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.2}
p{margin:0}
.serif{font-family:var(--serif);font-weight:400}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* shell */
#app{display:block}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:24px;color:var(--navy);letter-spacing:.2px}
.brand .mark{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--navy),var(--blue));display:grid;place-items:center;color:#fff}
.brand .mark svg{width:16px;height:16px;stroke:#fff}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;background:var(--soft);color:var(--blue-d);border:0}
.chip.teal{background:var(--teal-soft);color:var(--teal)} .chip.amber{background:var(--amber-soft);color:var(--amber)} .chip.red{background:var(--red-soft);color:var(--red)} .chip.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
.sos{background:var(--red);color:#fff;border:0;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 2px;color:var(--muted);font-size:11px;font-weight:600;border-radius:12px}
nav.tabs button[aria-current="page"]{color:var(--blue-d)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.3}
main{max-width:1000px;margin:0 auto;padding:18px 16px 110px}
@media (min-width:900px){
  nav.tabs{top:calc(env(safe-area-inset-top,0px) + 58px);bottom:0;right:auto;width:92px;flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:1px solid var(--line);padding:16px 8px}
  main{margin-left:max(104px,calc((100vw - 1000px)/2 + 40px));padding-bottom:60px}
}
.view-title{font-family:var(--serif);font-size:30px;color:var(--navy);margin-bottom:4px}
.sub{color:var(--muted)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
@media (max-width:480px){.grid.two{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card.flat{box-shadow:none}
.big{font-size:22px;font-weight:600;color:var(--navy)}
.row{display:flex;align-items:center;gap:10px}
.row.sp{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.mt{margin-top:14px}.mt-s{margin-top:8px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;background:var(--navy);color:var(--card);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.blue{background:var(--blue);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.ghost{background:var(--soft);color:var(--blue-d)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--blue-d);font-weight:600;padding:0;display:inline-flex;gap:4px;align-items:center}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;min-height:84px}
label{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.demo-banner{background:var(--amber-soft);color:var(--amber);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:14px;font-weight:500}
.greet{margin:6px 0 18px}
.greet h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,6vw,44px);color:var(--navy)}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--ink);text-align:center}
.qa button .ico{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--blue-d);display:grid;place-items:center}
.qa button.urgent .ico{background:var(--red-soft);color:var(--red)}
.qa button:hover{border-color:var(--blue)}
.thread{position:relative;display:flex;justify-content:space-between;gap:6px;padding:20px 4px 0;margin-top:6px}
.thread::before{content:"";position:absolute;left:10px;right:10px;top:27px;height:2px;background:linear-gradient(90deg,var(--teal),var(--blue))}
.thread .n{position:relative;flex:1;min-width:0;text-align:center;background:none;border:0;padding:0}
.thread .dot{width:16px;height:16px;border-radius:50%;background:var(--card);border:3px solid var(--teal);margin:0 auto 8px;display:block;position:relative}
.thread .n.up .dot{border-color:var(--blue);border-style:dashed}
.thread .t{font-size:12px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.thread .d{font-size:11.5px;color:var(--muted)}
.alert{display:flex;gap:10px;border-radius:14px;padding:12px;background:var(--amber-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent)}
.alert.red{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 35%,transparent)}
.alert svg{color:var(--amber);margin-top:2px}.alert.red svg{color:var(--red)}
.alert b{display:block;margin-bottom:2px}
.insight{background:linear-gradient(135deg,var(--navy),#1F5E9C);color:#fff;border:0}
.insight h3{color:#BFD9F2}
.insight p{font-family:var(--serif);font-size:20px;line-height:1.35}
.insight .btn{background:rgba(255,255,255,.16);color:#fff}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.item:first-child{border-top:0}
.item .ico{width:36px;height:36px;border-radius:11px;background:var(--soft);color:var(--blue-d);display:grid;place-items:center;flex:none}
.item .ico.teal{background:var(--teal-soft);color:var(--teal)} .item .ico.amber{background:var(--amber-soft);color:var(--amber)} .item .ico.red{background:var(--red-soft);color:var(--red)}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.item .txt span{color:var(--muted);font-size:14px}
.pips{display:flex;gap:6px}
.pip{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:#fff;padding:0}
.pip.on{background:var(--teal);border-color:var(--teal)} .pip svg{width:14px;height:14px;stroke-width:3}
.tabsbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:12px 0}
.tabsbar button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.tabsbar button[aria-pressed="true"]{background:var(--navy);color:var(--card);border-color:var(--navy)}
/* timeline */
.tl-year{font-family:var(--serif);font-size:26px;color:var(--navy);margin:20px 0 6px}
.tl{position:relative;margin-left:14px;padding-left:26px;border-left:2px solid var(--line)}
.tl .ev{position:relative;display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.tl .ev::before{content:"";position:absolute;left:-35px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--teal)}
.tl .ev.t-report::before{border-color:var(--blue)} .tl .ev.t-symptom::before{border-color:var(--amber)} .tl .ev.t-medicine::before,.tl .ev.t-prescription::before{border-color:var(--teal)} .tl .ev.t-visit::before{border-color:var(--navy)} .tl .ev.up::before{border-style:dashed}
.tl .ev:hover{border-color:var(--blue)}
.tl .ev .meta{color:var(--muted);font-size:13px}
.tl .ev b{display:block}
/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num{font-variant-numeric:tabular-nums}
.arrow{font-weight:700}
.arrow.up{color:var(--blue-d)} .arrow.down{color:var(--teal)} .arrow.same{color:var(--muted)}
.rng{font-size:12.5px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--sans)}
.chart .ln{stroke:var(--blue);fill:none;stroke-width:2.2}
.chart .pt{fill:var(--card);stroke:var(--blue);stroke-width:2.2}
.chart .band{fill:var(--teal);opacity:.12}
.chart .grid{stroke:var(--line)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(8,20,35,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-card{width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.sheet-card.wide{max-width:860px}
@media (min-width:700px){.sheet{align-items:center}.sheet-card{border-radius:22px;max-height:88%}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-card header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.sheet-card header h3{font-family:var(--serif);font-size:24px;font-weight:500;color:var(--navy)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:80;background:var(--navy);color:var(--card);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:90%}
/* chat */
.chat{display:flex;flex-direction:column;gap:12px;min-height:260px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--navy);color:var(--card);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.src{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.src button{border:1px solid var(--line);background:var(--soft);color:var(--blue-d);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.composer{position:sticky;bottom:78px;display:flex;gap:8px;background:var(--bg);padding:10px 0}
@media (min-width:900px){.composer{bottom:0}}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 2px;animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.5}}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:10px;align-items:flex-start}
.step .tick{width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;flex:none;margin-top:1px}
.step .tick svg{width:14px;height:14px;stroke-width:3}
.step.wait .tick{background:var(--line)}
.empty{text-align:center;padding:26px 14px;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.dropzone{border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;background:var(--card)}
.sosbig{width:100%;background:var(--red);color:#fff;border:0;border-radius:18px;padding:18px;font-size:20px;font-weight:700;display:flex;gap:10px;align-items:center;justify-content:center}
.note{font-size:13.5px;color:var(--muted)}
.hide{display:none!important}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.sw:first-child{border-top:0}
.tog{position:relative;width:46px;height:28px;border-radius:999px;background:var(--line);border:0;flex:none;padding:0}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.tog[aria-checked="true"]{background:var(--teal)}
.tog[aria-checked="true"]::after{transform:translateX(18px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.topbar,nav.tabs,.composer{display:none}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="mark" id="logoMark"></span>Veda</div>
    <span class="spacer"></span>
    <span class="chip plain" id="syncChip" title="Where your data is stored"></span>
    <button class="sos" data-act="openSOS" aria-label="Emergency SOS"><span id="sosIc"></span>SOS</button>
    <button class="iconbtn" data-act="openMore" aria-label="More: cabinet, family, records, profile, privacy"><span id="moreIc"></span></button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Main navigation"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheetCard" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><header><h3 id="sheetTitle"></h3><button class="iconbtn" data-act="closeSheet" aria-label="Close"><span id="xIc"></span></button></header><div id="sheetBody"></div></div></div>
<div id="toastHost"></div>

<script>
/* ============ utils ============ */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>iso(new Date());
const addDays=(n,from=new Date())=>{const d=new Date(from);d.setDate(d.getDate()+n);return iso(d)};
const D=s=>new Date(s+'T00:00:00');
const fmt=s=>s?D(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';
const fmtS=s=>s?D(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'—';
const diffDays=(a,b)=>Math.round((D(a)-D(b))/864e5);
const age=dob=>{if(!dob)return null;const b=D(dob),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:null};
const fmtN=n=>n==null?'—':(Math.round(n*100)/100).toString();
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}

const ICON={home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
route:'M6 19a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM18 10a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM8.5 16.5H15a3 3 0 0 0 0-6h-1.5',
file:'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6',
calendar:'M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z',
spark:'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z',
pill:'M10.5 20.5 3.5 13.5a4.95 4.95 0 0 1 7-7l7 7a4.95 4.95 0 0 1-7 7ZM8.5 8.5l7 7',
scan:'M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10',
upload:'M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3',
alert:'M12 4 2.5 20h19zM12 10v4M12 17h.01',
users:'M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20M10 11.5a3.25 3.25 0 1 0 0-6.5 3.25 3.25 0 0 0 0 6.5ZM20 20v-1.5a3.5 3.5 0 0 0-2.5-3.35M15.5 5.2a3.25 3.25 0 0 1 0 6.1',
user:'M5 20a7 7 0 0 1 14 0M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z',
shield:'M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6zM9 12l2 2 4-4',

async function pushDb(){
  if(!DB)return; if(writing){writeAgain=true;return} writing=true;
  try{
    if(S.chat.length>40)S.chat=S.chat.slice(-40);
    let payload=JSON.stringify(S);
    if(payload.length>230000){S.chat=S.chat.slice(-8);payload=JSON.stringify(S)}
    await DB.ref.set({payload,rev:S.rev});sync='synced';
  }catch(e){sync=(e&&e.code==='quota_exceeded')?'full':'local'}
  writing=false;paintSync();if(writeAgain){writeAgain=false;pushDb()}
}
async function initDb(){
  try{
    if(!window.claude)return paintSync();
    const [user,db]=await Promise.all([claude.use('user'),claude.use('db')]);
    if(!user||!db)return paintSync();
    const id=await user.id(); if(!id)return paintSync();
    const ref=db.doc('data/users/'+id+'/state'); DB={db,ref};
    ref.onSnapshot(snap=>{
      if(snap.metadata&&snap.metadata.hasPendingWrites)return;
      if(!snap.exists){sync='synced';if(S.onboarded)save();paintSync();return}
      const d=snap.data()||{};let rem;try{rem=JSON.parse(d.payload)}catch(e){return}
      if((d.rev||0)>S.rev){S=Object.assign(blank(),rem);S.rev=d.rev;ls(KEY,JSON.stringify(S));render()}
      else if(S.rev>(d.rev||0)&&!writing){pushDb()}
      sync='synced';paintSync();
    },()=>{sync='local';paintSync()});
  }catch(e){paintSync()}
}

const ALIAS={hb:'hemoglobin',hgb:'hemoglobin',haemoglobin:'hemoglobin',totalcholesterol:'cholesterol',chol:'cholesterol',ldl:'ldlcholesterol',ldlc:'ldlcholesterol',hdl:'hdlcholesterol',hdlc:'hdlcholesterol',fastingglucose:'glucose',fastingbloodsugar:'glucose',fbs:'glucose',fastingplasmaglucose:'glucose',plateletcount:'platelets',wbc:'wbccount',totalwbccount:'wbccount',rbc:'rbccount',triglycerides:'triglycerides',tg:'triglycerides'};
function keyOf(n){let k=String(n||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(k.startsWith('vitamind')||k.startsWith('25oh')||k==='vitd')return 'vitamind';if(k.startsWith('vitaminb12')||k==='b12')return 'vitaminb12';return ALIAS[k]||k}
const labs=()=>S.docs.filter(d=>d.params&&d.params.some(p=>p.value!=null)).sort((a,b)=>a.date.localeCompare(b.date)||a.addedAt-b.addedAt);
function history(key){return labs().map(d=>{const p=d.params.find(p=>keyOf(p.name)===key&&p.value!=null);return p?{docId:d.id,date:d.date,value:p.value,unit:p.unit,lo:p.refLow,hi:p.refHigh,name:p.name}:null}).filter(Boolean)}
function allKeys(){const m=new Map();labs().forEach(d=>d.params.forEach(p=>{if(p.value!=null){const k=keyOf(p.name);if(!m.has(k))m.set(k,p.name)}}));return m}
function rangeFlag(v,lo,hi){if(v==null)return null;if(lo!=null&&v<lo)return 'below';if(hi!=null&&v>hi)return 'above';return null}
function changesFor(doc){
  const L=labs();const i=L.findIndex(d=>d.id===doc.id);const out=[];
  doc.params.forEach(p=>{if(p.value==null)return;const k=keyOf(p.name);let prev=null;
    for(let j=i-1;j>=0;j--){const q=L[j].params.find(q=>keyOf(q.name)===k&&q.value!=null);if(q){prev={v:q.value,date:L[j].date,docId:L[j].id};break}}
    const pct=prev&&prev.v!==0?(p.value-prev.v)/Math.abs(prev.v)*100:null;
    const dir=!prev?'new':Math.abs(pct??0)<1?'same':p.value>prev.v?'up':'down';
    out.push({name:p.name,key:k,cur:p.value,prev:prev?prev.v:null,prevDate:prev?prev.date:null,unit:p.unit,pct,dir,flag:rangeFlag(p.value,p.refLow,p.refHigh),lo:p.refLow,hi:p.refHigh})});
  return out}
function latestLab(){const L=labs();return L[L.length-1]||null}
function changeLine(c){
  const a=c.dir==='up'?'increased':c.dir==='down'?'decreased':'stayed about the same';
  let s=c.prev==null?`${c.name} is ${fmtN(c.cur)} ${c.unit||''} (first value on record).`:`${c.name} ${a}: ${fmtN(c.prev)} → ${fmtN(c.cur)} ${c.unit||''}${c.pct!=null&&c.dir!=='same'?` (${c.pct>0?'+':''}${Math.round(c.pct)}%)`:''}.`;
  if(c.flag){s+=` The report lists a reference range of ${c.lo??'—'}–${c.hi??'—'}; this value is ${c.flag} it.`}
  return s.replace(/\s+/g,' ')}
const activeMeds=()=>S.medicines.filter(m=>m.status==='active');
function conflicts(){
  const out=[];const meds=activeMeds();
  const CLS={penicillin:['penicillin','amoxicillin','amoxycillin','ampicillin','cloxacillin','piperacillin','flucloxacillin'],sulfa:['sulfa','sulfamethoxazole','cotrimoxazole','co-trimoxazole','sulfasalazine'],nsaid:['ibuprofen','diclofenac','naproxen','ketorolac','aspirin','nimesulide'],aspirin:['aspirin','acetylsalicylic'],cephalosporin:['cef','cephalexin']};
  S.allergies.forEach(a=>{const an=a.name.toLowerCase().trim();if(!an)return;const terms=new Set([an,...(CLS[an]||[])]);
    meds.forEach(m=>{const hay=(m.name+' '+(m.ingredient||'')).toLowerCase();
      for(const t of terms){if(t&&(hay.includes(t)||(an.length>3&&t.includes(an)&&hay.includes(an)))){out.push({id:'al-'+a.id+'-'+m.id,type:'allergy',title:'Potential conflict detected',text:`Your health records contain an allergy to ${a.name}${a.reaction?` (${a.reaction})`:''}, while ${m.name}${m.ingredient?` (${m.ingredient})`:''} appears in a medicine you recorded${m.start?` on ${fmt(m.start)}`:''}. Please confirm with your doctor or pharmacist.`,medIds:[m.id]});break}}})});
  const split=s=>String(s||'').toLowerCase().split(/\+|,|\/|&|\band\b/).map(x=>x.replace(/\b\d+(\.\d+)?\s*(mg|mcg|g|ml|iu)\b/g,'').trim()).filter(Boolean);
  for(let i=0;i<meds.length;i++)for(let j=i+1;j<meds.length;j++){
    const a=split(meds[i].ingredient||meds[i].name),b=split(meds[j].ingredient||meds[j].name);const shared=a.filter(x=>b.includes(x));
    if(shared.length)out.push({id:'dup-'+meds[i].id+'-'+meds[j].id,type:'dup',title:'Possible duplicate ingredient',text:`${meds[i].name} and ${meds[j].name} appear to contain the same active ingredient (${shared.join(', ')}) but may be from different brands. Please confirm with your doctor or pharmacist before taking them together.`,medIds:[meds[i].id,meds[j].id]})}
  return out.filter(c=>!S.dismissed[c.id])}
function nextAppt(){return S.appointments.filter(a=>a.date>=today()).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')))[0]||null}
function timeline(){
  const ev=[];
  S.docs.forEach(d=>ev.push({id:'d'+d.id,type:d.kind==='prescription'?'prescription':d.kind==='discharge'?'visit':'report',date:d.date,title:d.title,detail:d.kind==='prescription'?'Prescription added':d.kind==='lab'?'Report uploaded':'Document added',ref:{k:'doc',id:d.id}}));
  S.medicines.forEach(m=>{if(m.start)ev.push({id:'m'+m.id,type:'medicine',date:m.start,title:`Started ${m.name}${m.strength?' '+m.strength:''}`,detail:m.doctor?`Prescribed by ${m.doctor}`:'Medicine started',ref:{k:'med',id:m.id}})});
  S.symptoms.forEach(s=>ev.push({id:'s'+s.id,type:'symptom',date:s.date,title:`Symptom: ${s.name}`,detail:[s.severity,s.note].filter(Boolean).join(' · ')||'Symptom recorded',ref:{k:'sym',id:s.id}}));
  S.appointments.forEach(a=>{const up=a.date>=today();ev.push({id:'a'+a.id,type:up?'followup':'visit',date:a.date,upcoming:up,title:up?`Upcoming: ${a.doctor}`:`Doctor visit: ${a.doctor}`,detail:a.purpose||'Appointment',ref:{k:'appt',id:a.id}})});
  S.events.forEach(e=>ev.push({id:'e'+e.id,type:e.type||'note',date:e.date,title:e.title,detail:e.detail||'',ref:{k:'evt',id:e.id}}));
  return ev.sort((a,b)=>b.date.localeCompare(a.date))}

function whatChanged(doc){const ch=changesFor(doc);if(!ch.length)return `<p class="sub">No measurable values were found in this document.</p>`;

  const rows=ch.map(c=>`<tr><td>${esc(c.name)}</td><td class="num">${c.prev==null?'—':fmtN(c.prev)}</td><td class="num"><b>${fmtN(c.cur)}</b> <span class="note">${esc(c.unit||'')}</span></td><td><span class="arrow ${c.dir}" title="${c.dir}">${c.dir==='up'?'↑':c.dir==='down'?'↓':c.dir==='same'?'→':'•'}</span></td><td class="rng note">${c.lo!=null||c.hi!=null?`${c.lo??''}–${c.hi??''}`:''}${c.flag?` <span class="chip amber">${c.flag} range</span>`:''}</td></tr>`).join('');

function vTrends(){
  const keys=[...allKeys()];const L=labs();
  if(!keys.length)return `<h2 class="view-title">Compare &amp; trends</h2>${empty('No measurable values yet','Upload a lab report to see trends.')}`;
  const sel=(viewArg&&viewArg.key)||keys[0][0];const h=history(sel);const last=h[h.length-1];
  const a=(viewArg&&viewArg.a)||(L.length>1?L[L.length-2].id:L[0].id),b=(viewArg&&viewArg.b)||L[L.length-1].id;
  const da=S.docs.find(d=>d.id===a),db_=S.docs.find(d=>d.id===b);
  const ks=[...new Set([...(da?da.params:[]),...(db_?db_.params:[])].filter(p=>p.value!=null).map(p=>keyOf(p.name)))];
  const val=(d,k)=>{const p=d&&d.params.find(p=>keyOf(p.name)===k&&p.value!=null);return p?p:null};
  return `<h2 class="view-title">Compare &amp; trends</h2><p class="sub">Choose a value to see how it has moved between reports.</p>
  <div class="card mt"><div class="field"><label for="trKey">Value</label><select id="trKey">${keys.map(k=>`<option value="${esc(k[0])}" ${k[0]===sel?'selected':''}>${esc(k[1])}</option>`).join('')}</select></div>
  ${trendSVG(h,last&&last.lo,last&&last.hi)}
  <p class="sub mt-s">${h.length>1?esc(changeLine({name:last.name,dir:last.value>h[h.length-2].value?'up':last.value<h[h.length-2].value?'down':'same',prev:h[h.length-2].value,cur:last.value,unit:last.unit,pct:h[h.length-2].value?(last.value-h[h.length-2].value)/Math.abs(h[h.length-2].value)*100:null,flag:rangeFlag(last.value,last.lo,last.hi),lo:last.lo,hi:last.hi})):'Only one value on record so far.'}</p></div>
  <div class="card mt"><h3>${ic('file')} Compare two reports</h3><div class="two-col"><div><label for="cmpA">Earlier</label><select id="cmpA">${L.map(d=>`<option value="${d.id}" ${d.id===a?'selected':''}>${esc(d.title)} · ${fmtS(d.date)}</option>`).join('')}</select></div><div><label for="cmpB">Later</label><select id="cmpB">${L.map(d=>`<option value="${d.id}" ${d.id===b?'selected':''}>${esc(d.title)} · ${fmtS(d.date)}</option>`).join('')}</select></div></div>
  <div class="tbl-wrap mt"><table><thead><tr><th>Parameter</th><th>${fmtS(da&&da.date)}</th><th>${fmtS(db_&&db_.date)}</th><th>Change</th></tr></thead><tbody>${ks.map(k=>{const x=val(da,k),y=val(db_,k);const dir=x&&y?(Math.abs(y.value-x.value)/(Math.abs(x.value)||1)<.01?'same':y.value>x.value?'up':'down'):'new';return `<tr><td>${esc((y||x).name)}</td><td class="num">${x?fmtN(x.value):'—'}</td><td class="num">${y?fmtN(y.value):'—'}</td><td><span class="arrow ${dir}">${dir==='up'?'↑':dir==='down'?'↓':dir==='same'?'→':'•'}</span></td></tr>`}).join('')}</tbody></table></div></div>
  <div class="card mt"><h3>${ic('spark')} Worth discussing</h3>${(()=>{const c=changesFor(L[L.length-1]).filter(c=>c.flag||(c.pct!=null&&Math.abs(c.pct)>=8));return c.length?`<ul style="margin:0;padding-left:18px">${c.map(x=>`<li>${esc(changeLine(x))}</li>`).join('')}</ul><p class="note mt-s">These are values outside the report's own reference range or that moved noticeably. They are conversation starters for your clinician, not a diagnosis.</p>`:'<p class="sub">Nothing stands out in your latest report.</p>'})()}</div>`}
function trendSVG(pts,lo,hi){
  if(!pts.length)return '';const W=320,H=160,P={l:36,r:14,t:14,b:26};const vs=pts.map(p=>p.value);
  let mn=Math.min(...vs,lo??Infinity),mx=Math.max(...vs,hi??-Infinity);const pad=(mx-mn||1)*.15;mn-=pad;mx+=pad;
  const x=i=>P.l+(pts.length===1?(W-P.l-P.r)/2:i*(W-P.l-P.r)/(pts.length-1)),y=v=>P.t+(mx-v)/(mx-mn)*(H-P.t-P.b);
  const band=(lo!=null&&hi!=null)?`<rect class="band" x="${P.l}" y="${y(hi)}" width="${W-P.l-P.r}" height="${Math.max(2,y(lo)-y(hi))}"/>`:'';
  const path=pts.map((p,i)=>(i?'L':'M')+x(i)+' '+y(p.value)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart"><line class="grid" x1="${P.l}" x2="${W-P.r}" y1="${H-P.b}" y2="${H-P.b}"/>${band}<text x="4" y="${y(mx-pad)+3}">${fmtN(mx-pad)}</text><text x="4" y="${y(mn+pad)+3}">${fmtN(mn+pad)}</text>${pts.length>1?`<path class="ln" d="${path}"/>`:''}${pts.map((p,i)=>`<circle class="pt" cx="${x(i)}" cy="${y(p.value)}" r="4"/><text x="${x(i)}" y="${y(p.value)-9}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${fmtN(p.value)}</text><text x="${x(i)}" y="${H-8}" text-anchor="middle">${fmtS(p.date)}</text>`).join('')}</svg>${band?`<p class="note">Shaded band: the reference range printed on the report.</p>`:''}`}

  return `<h2 class="view-title">Medicine cabinet</h2><p class="sub">Your medicines, with dosage details you confirm yourself.</p>
  <div class="row wrap mt"><button class="btn blue" data-act="medForm">${ic('plus')} Add medicine</button><button class="btn teal" data-act="scanMed">${ic('camera')} Scan medicine</button><button class="btn line" data-act="startUpload" data-kind="prescription">${ic('upload')} From prescription</button></div>

function buildBrief(a){
  const p=S.profile,ag=age(p.dob);
  const lab=latestLab();const ch=lab?changesFor(lab).filter(c=>c.dir!=='new'&&(c.dir!=='same'||c.flag)):[];
  const since=addDays(-30,D(a.date));const sy={};S.symptoms.filter(s=>s.date>=since&&s.date<=a.date).forEach(s=>{(sy[s.name]=sy[s.name]||[]).push(s)});
  const cf=conflicts();const q=[];
  ch.filter(c=>c.flag||Math.abs(c.pct||0)>=8).slice(0,3).forEach(c=>q.push(`Should I repeat or follow up on my ${c.name} result?`));
  if(activeMeds().length)q.push('Should my current medicines be reviewed?');
  cf.forEach(c=>q.push(c.type==='allergy'?`My records list an allergy that may relate to a medicine I've been given. Can we confirm it's suitable?`:`Two of my medicines may contain the same ingredient. Can we check I'm not duplicating it?`));
  return {summary:[`${p.name||'Patient'}${ag!=null?`, ${ag}`:''}${p.sex?`, ${p.sex}`:''}. Appointment with ${a.doctor} on ${fmt(a.date)}${a.purpose?` — ${a.purpose}`:''}.`,S.allergies.length?`Allergies: ${S.allergies.map(x=>x.name+(x.reaction?` (${x.reaction})`:'')).join(', ')}.`:'No allergies recorded.',p.conditions?`Conditions I've noted: ${p.conditions}.`:''].filter(Boolean).join(' '),
   changes:ch.map(changeLine).join('\n')||'No changes recorded since the previous report.',

   reports:S.docs.filter(d=>d.date<=a.date&&diffDays(a.date,d.date)<=120).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,4).map(d=>`${d.title} — ${fmt(d.date)}`).join('\n')||'None in the last 4 months.',
   symptoms:Object.entries(sy).map(([n,l])=>`${n} recorded ${l.length} time${l.length>1?'s':''} in the last 30 days${l.some(x=>x.severity)?` (severity: ${[...new Set(l.map(x=>x.severity).filter(Boolean))].join(', ')})`:''}`).join('\n')||'No symptoms recorded in the last 30 days.',
   visits:S.appointments.filter(x=>x.date<today()&&x.id!==a.id).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,2).map(x=>`${x.doctor} — ${fmt(x.date)}${x.purpose?': '+x.purpose:''}${x.notes?' ('+x.notes+')':''}`).join('\n')||'None recorded.',
   questions:[...new Set(q)].map(x=>'• '+x).join('\n')||'• '}}

function collectBrief(id){const a=S.appointments.find(x=>x.id===id),b=S.briefs[id];if(!a||!b)return null;

async function ask(q){
  S.chat.push({r:'u',t:q});save();

  const chat=$('#chat');const think=document.createElement('div');think.className='msg a';think.id='thinking';think.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';chat&&chat.insertBefore(think,$('#chatEnd'));$('#chatEnd')&&$('#chatEnd').scrollIntoView({block:'end'});
  let res;

    try{const response=await fetch(backendUrl()+'/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,records:recordsContext(),history:S.chat.slice(-8)})});if(!response.ok)throw new Error('AI backend request failed ('+response.status+').');const data=await response.json();res={t:String(data.answer||'I could not find that in your records.'),src:(data.sources||[]).filter(x=>x&&x.id).slice(0,5)}}catch(e){res={t:'The AI backend could not be reached. Check the backend URL in Privacy. '+e.message,src:[]}}

CONVERSATION SO FAR:\n${hist}
USER QUESTION: ${q}`;
      const r=await SAMPLE.json(prompt,{modelTier:'default',cache:false});
      res={t:String(r.answer||'I could not find that in your records.'),src:(r.sources||[]).filter(s=>s&&s.id).slice(0,5)};

function localAnswer(q){const t=q.toLowerCase();const lab=latestLab();
  if(/medicine|medication|taking/.test(t)){const m=activeMeds();return {t:m.length?`You have ${m.length} active medicine${m.length>1?'s':''}:\n`+m.map(x=>`• ${x.name}${x.strength?' '+x.strength:''}${x.frequency?' — '+x.frequency:''}`).join('\n'):'No active medicines are recorded.',src:m.map(x=>({kind:'medicine',id:x.id,label:x.name}))}}
  if(/changed|difference|compare/.test(t)&&lab){const c=changesFor(lab).filter(x=>x.dir!=='new'&&x.dir!=='same');return {t:c.length?c.map(changeLine).join('\n')+'\n\nYou may want to discuss these changes with your healthcare professional.':'No changes compared with a previous report were found.',src:[{kind:'doc',id:lab.id,label:lab.title}]}}
  const key=[...allKeys()].find(([k,n])=>t.includes(n.toLowerCase())||t.includes(k));
  if(key){const h=history(key[0]);const l=h[h.length-1];const d=S.docs.find(x=>x.id===l.docId);return {t:`Your ${key[1]} was ${fmtN(l.value)} ${l.unit||''} on ${fmt(l.date)}${h.length>1?` (previously ${fmtN(h[h.length-2].value)})`:''}.`,src:[{kind:'doc',id:d.id,label:d.title}]}}
  if(/blood|test|report|last/.test(t)&&lab)return {t:`Your most recent report is ${lab.title} from ${fmt(lab.date)}.`,src:[{kind:'doc',id:lab.id,label:lab.title}]};
  if(/appointment|prepare|doctor/.test(t)){const a=nextAppt();return a?{t:`Your next appointment is with ${a.doctor} on ${fmt(a.date)}. Open the Appointments tab to prepare a Doctor Brief.`,src:[{kind:'appointment',id:a.id,label:a.doctor+' — '+fmtS(a.date)}]}:{t:'You have no upcoming appointments recorded.',src:[]}}
  return {t:"I don't have enough information in your records to answer that.",src:[]}}

const EXTRACT_PROMPT=`You are extracting structured data from a healthcare document (image and/or text). Report ONLY what is actually visible or written. Never invent values, dates or names. Do not diagnose or interpret.
Return ONLY JSON of this shape:
{"legible":boolean,"kind":"lab"|"prescription"|"discharge"|"other","title":string,"date":"YYYY-MM-DD"|null,"lab":string|null,"doctor":string|null,

"summary":"2-3 plain-language sentences describing what the document contains, without diagnosis"}

let pending=null;
async function loadScriptOnce(src, test){if(test&&test())return;await new Promise((resolve,reject)=>{const old=[...document.scripts].find(x=>x.src===src);if(old){old.addEventListener('load',resolve,{once:true});if(test&&test())resolve();return}const el=document.createElement('script');el.src=src;el.onload=resolve;el.onerror=()=>reject(new Error('Could not load the OCR library. Check your internet connection and try again.'));document.head.appendChild(el)})}
async function browserOCR(file){
  if(file.type==='application/pdf'){
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',()=>!!window.pdfjsLib);
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const bytes=await file.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:bytes}).promise;let all='';
    for(let n=1;n<=Math.min(pdf.numPages,8);n++){const page=await pdf.getPage(n),vp=page.getViewport({scale:1.6}),canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;all+='\n'+(await ocrCanvas(canvas))+ '\n'}return all.trim();
  }

}
async function ocrCanvas(source){await loadScriptOnce('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',()=>!!window.Tesseract);const r=await Tesseract.recognize(source,'eng');return (r.data&&r.data.text||'').trim()}
function localExtract(text,type){
  const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const params=[];
  for(const line of lines){const m=line.match(/^(.{2,55}?)\s{1,}|^(.{2,55}?)\s*[:\-]\s*/);const nums=[...line.matchAll(/[-+]?\d+(?:\.\d+)?/g)].map(x=>Number(x[0]));if(nums.length&&/(?:g\/dl|mg\/dl|mmol|ng\/ml|iu\/l|miu|%|µ|ml|cells|platelet|hemoglobin|haemoglobin|glucose|cholesterol|vitamin|creatinine|tsh|wbc|rbc|hba1c|ldl|hdl|triglyceride)/i.test(line)){const name=(m&&(m[1]||m[2])||line.split(/\s{2,}/)[0]).replace(/[:\-]+$/,'').trim();const unit=(line.match(/(?:g\/dL|mg\/dL|mmol\/L|ng\/mL|IU\/L|mIU\/L|%|µIU\/mL|cells\/[^\s]+)/i)||[])[0]||'';params.push({name,value:nums[0],text:'',unit,refLow:null,refHigh:null})}}

  const meds=[];if(type==='prescription'){for(const l of lines){if(/\b\d+\s?(?:mg|mcg|g|ml|iu)\b/i.test(l)&&l.length<120)meds.push({name:l.replace(/\s{2,}/g,' ').slice(0,90),ingredient:'',strength:'',frequency:'',duration:''})}}

}
async function runExtract(){

    let extractedText=text||'',fileName=f?f.name:null;
    if(f){const ocr=await browserOCR(f);extractedText=[extractedText,ocr].filter(Boolean).join('\n\n')}

    }else if(SAMPLE){const opts={modelTier:'default'};if(f&&f.type.startsWith('image/'))opts.images=[await prepImage(f)];r=await SAMPLE.json(`${EXTRACT_PROMPT}\nThe user says this is a: ${type}.\nDocument text:\n${extractedText.slice(0,50000)}`,opts)}

    pending={id:uid(),kind:['lab','prescription','discharge','other'].includes(r.kind)?r.kind:type,title:r.title||'Medical document',date:/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')?r.date:today(),dateGuess:!/\d{4}-\d{2}-\d{2}/.test(r.date||''),lab:r.lab||'',doctor:r.doctor||'',params:(r.params||[]).map(p=>({name:String(p.name||''),value:num(p.value),text:p.text||'',unit:p.unit||'',refLow:num(p.refLow),refHigh:num(p.refHigh)})).filter(p=>p.name),medicines:(r.medicines||[]).filter(m=>m&&m.name),summary:r.summary||'',source:f?'upload':'text',fileName,ocrText:extractedText,file:f||null};

  }catch(e){st.innerHTML=`<div class="alert red">${ic('alert')}<div><b>Couldn't process this document</b><span>${esc(e.message||'Try again, or enter values manually.')}</span></div></div>`;go_.disabled=false}
}

/* medicine scanner */
function scanMed(){
  const can=aiOn()&&IMGOK;
  sheet('Medicine scanner',`<p class="sub">Photograph the strip, box or label so the name is clearly visible. If Veda isn't confident, it won't guess.</p>
  ${can?`<div class="dropzone mt"><input id="mdFile" type="file" accept="image/*" capture="environment"></div>`:`<div class="alert mt">${ic('alert')}<div><b>Photo scanning isn't available</b><span>${!SAMPLE?'AI is not available in this view.':!S.consents.ai?'AI is switched off in Privacy.':'This viewer cannot send images.'} You can type the name from the packaging instead.</span></div></div>`}
  <div class="field mt"><label for="mdName">${can?'Or type the name on the packaging':'Name on the packaging'}</label><input id="mdName" placeholder="e.g. Paracetamol 500 mg"></div>
  <div id="mdOut"></div><div class="row wrap"><button class="btn teal" id="mdGo" data-act="runMed" ${aiOn()?'':'disabled'}>${ic('scan')} Identify</button><button class="btn line" data-act="medForm">Add manually instead</button></div>`)}
let scanned=null;
async function runMed(){
  const f=$('#mdFile')&&$('#mdFile').files[0],name=val('mdName');if(!f&&!name){toast('Add a photo or type a name');return}
  const out=$('#mdOut'),btn=$('#mdGo');btn.disabled=true;out.innerHTML=`<p class="note"><span class="dots"><span></span><span></span><span></span></span> Looking closely…</p>`;
  try{
    const opts={modelTier:'default'};if(f)opts.images=[await prepImage(f)];
    const r=await SAMPLE.json(`You identify medicines from packaging photos or a typed name. Be conservative: NEVER guess. Only use text actually printed/typed. If the name or active ingredient is not clearly readable or you are not sure, set identified=false and confidence="low".
Return ONLY JSON: {"identified":boolean,"confidence":"high"|"medium"|"low","name":string|null,"ingredient":string|null,"strength":string|null,"manufacturer":string|null,"purpose":string|null,"info":string|null,"warnings":[string]}
purpose: general, commonly-known use in one short phrase. info: one or two sentences of basic information. warnings: only well-established general warnings (e.g. dose limits, common cautions); leave empty if unsure. Never advise starting, stopping or changing a medicine.${name?`\nTyped name: ${name}`:''}`,opts);
    btn.disabled=false;
    if(!r.identified||r.confidence==='low'||!r.name){scanned=null;out.innerHTML=`<div class="alert">${ic('alert')}<div><b>Not identified</b><span>I couldn't confidently identify this medicine. Please verify the name on the packaging or with a pharmacist.</span></div></div>`;return}
    scanned=r;
    out.innerHTML=`<div class="card flat mt"><div class="row sp"><b style="font-size:18px">Medicine identified: ${esc(r.name)}${r.strength&&!r.name.includes(r.strength)?' '+esc(r.strength):''}</b><span class="chip ${r.confidence==='high'?'teal':'amber'}">${r.confidence} confidence</span></div>
     <table style="margin-top:6px"><tbody>${[['Active ingredient',r.ingredient],['Strength',r.strength],['Manufacturer',r.manufacturer],['Common purpose',r.purpose]].filter(x=>x[1]).map(x=>`<tr><td class="note">${x[0]}</td><td>${esc(x[1])}</td></tr>`).join('')}</tbody></table>
     ${r.info?`<p class="mt-s">${esc(r.info)}</p>`:''}${(r.warnings||[]).length?`<ul style="margin:8px 0 0;padding-left:18px">${r.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}
     ${r.confidence!=='high'?`<p class="note mt-s">I'm not fully sure. Please double-check the name on the packaging or with a pharmacist.</p>`:''}
     <p class="note mt-s">Don't start, stop or change any medicine without advice from your doctor or pharmacist.</p>
     <div class="row mt"><button class="btn blue" data-act="addScanned">Add to medicine cabinet</button></div></div>`;
  }catch(e){btn.disabled=false;out.innerHTML=`<div class="alert red">${ic('alert')}<div><b>Couldn't scan</b><span>${esc(aiErr(e))}</span></div></div>`}
}

 async refreshCloudFiles(){const box=$('#cloudFilesList');if(box)box.innerHTML='<p class="note">Loading private cloud files…</p>';try{if(!backendUrl())throw new Error('Save your backend URL above first.');const data=await cloudApi('/api/files');const target=$('#cloudFilesList');if(!target)return;target.innerHTML=(data.files||[]).map(f=>`<div class="item"><span class="ico">${ic('file')}</span><div class="txt"><b>${esc(f.name)}</b><span>${esc(f.created_at||'Stored in cloud')}</span></div><button class="btn sm ghost" data-act="openCloudFile" data-path="${esc(f.id)}">Open</button><button class="iconbtn" data-act="deleteCloudFile" data-path="${esc(f.id)}" aria-label="Delete cloud file">${ic('trash')}</button></div>`).join('')||'<p class="note">No cloud files yet. Scan a document and save it after signing in.</p>'}catch(e){const target=$('#cloudFilesList');if(target)target.innerHTML=`<p class="note">${esc(e.message)}</p>`;else toast(e.message)}},
 async openCloudFile(el){try{const d=await cloudApi('/api/files/url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:el.dataset.path})});window.open(d.url,'_blank','noopener,noreferrer')}catch(e){toast('Could not open cloud file: '+e.message)}},
 async deleteCloudFile(el){if(!confirm('Permanently delete this cloud file?'))return;try{await cloudApi('/api/files?path='+encodeURIComponent(el.dataset.path),{method:'DELETE'});toast('Cloud file deleted');await A.refreshCloudFiles()}catch(e){toast('Delete failed: '+e.message)}},
 saveBackendUrl(){const u=val('backendUrlInput').trim();if(u&&!/^https?:\/\//i.test(u)){toast('Enter a valid https:// backend URL');return}ls('veda_backend_url',u||null);toast(u?'Backend URL saved':'Backend disconnected');render()},
 async testBackend(){const u=val('backendUrlInput').trim().replace(/\/$/,'');if(!u){toast('Enter the backend URL first');return}try{const r=await fetch(u+'/health');if(!r.ok)throw new Error('Status '+r.status);const d=await r.json();toast('Backend reachable: '+(d.status||'OK'))}catch(e){toast('Connection failed. Check URL, CORS and deployment.')}},
 toggleConsent(el){const c=el.dataset.c;S.consents[c]=!S.consents[c];S.consentLog.push({t:Date.now(),m:`${c==='ai'?'AI processing':'Family sharing'} turned ${S.consents[c]?'on':'off'}`});save();render()},
 async exportData(){await saveFile('veda-health-data.json',JSON.stringify(S,null,2))},
 deleteAll(){if(!confirm('Delete ALL your Veda data? This removes documents, medicines, appointments, family and chat. It can\'t be undone.'))return;const keep=S.consents;S=blank();S.consents=keep;S.onboarded=false;ls(KEY,null);save();navStack=[];view='home';render();toast('All data deleted')},
 askQ(el){closeSheet();ask(el.dataset.q)},
 chatSend(){const i=$('#chatIn');const q=i.value.trim();if(!q)return;i.value='';ask(q)},
 clearChat(){S.chat=[];save();render()},
 openSrc(el){const k=el.dataset.k,id=el.dataset.id;if(k==='doc')go('doc',id);else if(k==='medicine')go('cabinet');else if(k==='appointment')go('brief',id);else go('journey')},
 clearDemo(){if(!confirm('Remove all demo data? Your own records will be kept.'))return;['docs','medicines','appointments','symptoms','family'].forEach(k=>S[k]=S[k].filter(x=>!x.demo));S.allergies=S.allergies.filter(x=>!x.demo);S.profile.contacts=S.profile.contacts.filter(x=>!x.demo);S.profile.doctors=S.profile.doctors.filter(x=>!x.demo);S.briefs={};S.chat=[];S.demo=false;save();render()}
};
async function saveFile(name,data){try{const dl=window.claude&&await claude.use('downloads');if(dl){await dl.save({filename:name,data});toast('Saved');return}}catch(e){if(e&&e.code==='user_declined')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain'}));a.download=name;a.click();toast('Download started')}catch(e){toast('Download isn\'t available here. Use Copy instead.')}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el,e)}});
document.addEventListener('change',e=>{
  if(e.target.id==='trKey'){go('trends',{key:e.target.value,a:viewArg&&viewArg.a,b:viewArg&&viewArg.b},false)}
  if(e.target.id==='cmpA'||e.target.id==='cmpB'){go('trends',{key:viewArg&&viewArg.key,a:val('cmpA'),b:val('cmpB')},false)}
  if(['recK','recS'].includes(e.target.id)){go('records',{q:val('recQ'),k:val('recK'),s:val('recS')},false)}});
document.addEventListener('input',e=>{if(e.target.id==='recQ'){const pos=e.target.selectionStart;clearTimeout(window._rq);window._rq=setTimeout(()=>{go('records',{q:val('recQ'),k:val('recK'),s:val('recS')},false);const i=$('#recQ');if(i){i.focus();i.setSelectionRange(pos,pos)}},250)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden&&S.onboarded)closeSheet();if(e.key==='Enter'&&e.target.id==='chatIn'){e.preventDefault();A.chatSend()}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'&&S.onboarded)closeSheet()});
